<script>
// ===== NAUTILUS: piccolo scrittore di PDF (2026-11-18) =====
// Perche' non una libreria: il PDF serve a M in mare, senza segnale, e va fatto da una pagina che puo' essere aperta anche con rete debole; una libreria
// esterna e' un altro file da scaricare e un'altra cosa che puo' mancare. Qui basta poco: pagine, rettangoli, linee, poligoni, testo in Helvetica
// (font standard del PDF, non va incorporato) con le lettere accentate italiane (codifica WinAnsi). Si controlla qui trasformando il file in immagini.
// Coordinate: origine in ALTO a sinistra, in punti (1 pt = 1/72 di pollice), come in una pagina web.
var NPDF_W_REG = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584];
var NPDF_W_BOLD = [278, 333, 474, 556, 556, 889, 722, 238, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 333, 333, 584, 584, 584, 611, 975, 722, 722, 722, 722, 667, 611, 778, 722, 278, 556, 722, 611, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 333, 278, 333, 584, 556, 333, 556, 611, 556, 611, 556, 333, 611, 611, 278, 278, 556, 278, 889, 611, 611, 611, 611, 389, 556, 333, 611, 556, 778, 556, 556, 500, 389, 280, 389, 584];
function NautilusPdf() { this.pages = []; this.images = []; }
// Immagine JPEG gia' codificata (la mappa disegnata sul canvas): il PDF la include cosi' com'e' (DCTDecode), senza ricomprimerla. Ritorna l'indice da passare a page.image().
NautilusPdf.prototype.addImage = function(jpegBytes, w, h) { this.images.push({ data: jpegBytes, w: w, h: h }); return this.images.length - 1; };
NautilusPdf.prototype.addPage = function(w, h) { var p = new NautilusPdfPage(w, h); this.pages.push(p); return p; };
function NautilusPdfPage(w, h) { this.w = w; this.h = h; this.ops = []; }
function npdfColor(c) { // '#rrggbb' -> '0.1 0.2 0.3'
  var m = /^#?([0-9a-f]{6})$/i.exec(c || '#000000'); if (!m) m = ['', '000000'];
  var v = parseInt(m[1], 16); return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255].map(function(x) { return (Math.round(x * 1000) / 1000).toString(); }).join(' ');
}
function npdfNum(n) { return (Math.round(n * 100) / 100).toString(); }
NautilusPdfPage.prototype.y = function(y) { return this.h - y; };
NautilusPdfPage.prototype.rect = function(x, y, w, h, o) {
  o = o || {}; var s = '';
  if (o.fill) s += npdfColor(o.fill) + ' rg ';
  if (o.stroke) s += npdfColor(o.stroke) + ' RG ' + npdfNum(o.lw || 0.5) + ' w ';
  s += npdfNum(x) + ' ' + npdfNum(this.y(y + h)) + ' ' + npdfNum(w) + ' ' + npdfNum(h) + ' re ' + (o.fill && o.stroke ? 'B' : (o.fill ? 'f' : 'S'));
  this.ops.push(s);
};
NautilusPdfPage.prototype.image = function(x, y, w, h, idx) { // x,y angolo in alto a sinistra, w,h in punti
  this.ops.push('q ' + npdfNum(w) + ' 0 0 ' + npdfNum(h) + ' ' + npdfNum(x) + ' ' + npdfNum(this.y(y + h)) + ' cm /Im' + idx + ' Do Q');
};
NautilusPdfPage.prototype.line = function(x1, y1, x2, y2, o) {
  o = o || {};
  this.ops.push(npdfColor(o.color || '#000000') + ' RG ' + npdfNum(o.lw || 0.5) + ' w ' + npdfNum(x1) + ' ' + npdfNum(this.y(y1)) + ' m ' + npdfNum(x2) + ' ' + npdfNum(this.y(y2)) + ' l S');
};
NautilusPdfPage.prototype.poly = function(pts, o) { // pts = [[x,y],...] chiuso
  o = o || {}; var s = '';
  if (o.fill) s += npdfColor(o.fill) + ' rg ';
  if (o.stroke) s += npdfColor(o.stroke) + ' RG ' + npdfNum(o.lw || 0.5) + ' w ';
  pts.forEach(function(p, i) { s += npdfNum(p[0]) + ' ' + npdfNum(this.y(p[1])) + (i === 0 ? ' m ' : ' l '); }, this);
  s += 'h ' + (o.fill && o.stroke ? 'B' : (o.fill ? 'f' : 'S'));
  this.ops.push(s);
};
NautilusPdf.width = function(str, size, bold) {
  var t = bold ? NPDF_W_BOLD : NPDF_W_REG, w = 0;
  for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); w += (c >= 32 && c <= 126) ? t[c - 32] : 556; }
  return w * size / 1000;
};
function npdfEsc(str) { // testo -> stringa PDF in WinAnsi: ( ) \ con la barra, lettere oltre il Latin-1 sostituite
  var out = '';
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c === 0x2013 || c === 0x2014) c = 45; else if (c === 0x2019) c = 39; else if (c === 0x2022) c = 0x95; else if (c > 255) c = 63;
    var ch = String.fromCharCode(c);
    out += (ch === '(' || ch === ')' || ch === '\\') ? '\\' + ch : ch;
  }
  return out;
}
// o: size, font ('R' normale, 'B' grassetto, 'I' corsivo), color, align ('l','c','r'), rot (gradi, antiorario)
NautilusPdfPage.prototype.text = function(x, y, str, o) {
  o = o || {}; var size = o.size || 10, font = o.font || 'R', w = NautilusPdf.width(String(str), size, font === 'B');
  var dx = o.align === 'c' ? -w / 2 : (o.align === 'r' ? -w : 0), f = font === 'B' ? 'F2' : (font === 'I' ? 'F3' : 'F1');
  var r = (o.rot || 0) * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r), px = x + dx * cs, py = this.y(y) + dx * sn;
  this.ops.push('BT ' + npdfColor(o.color || '#000000') + ' rg /' + f + ' ' + npdfNum(size) + ' Tf ' + npdfNum(cs) + ' ' + npdfNum(sn) + ' ' + npdfNum(-sn) + ' ' + npdfNum(cs) + ' ' + npdfNum(px) + ' ' + npdfNum(py) + ' Tm (' + npdfEsc(String(str)) + ') Tj ET');
};
NautilusPdf.prototype.build = function(meta) { // -> Uint8Array
  meta = meta || {};
  var objs = [], self = this;
  function add(s) { objs.push(s); return objs.length; }
  var catalog = add(''), pagesObj = add('');
  var f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  var f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var f3 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>');
  var imgObjs = this.images.map(function(im) {
    var bin = ''; for (var i = 0; i < im.data.length; i++) bin += String.fromCharCode(im.data[i]);
    return add('<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bin.length + ' >>\nstream\n' + bin + '\nendstream');
  });
  var xo = imgObjs.map(function(o, i) { return '/Im' + i + ' ' + o + ' 0 R'; }).join(' ');
  var kids = [];
  this.pages.forEach(function(p) {
    var content = p.ops.join('\n'), cobj = add('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
    var pobj = add('<< /Type /Page /Parent ' + pagesObj + ' 0 R /MediaBox [0 0 ' + npdfNum(p.w) + ' ' + npdfNum(p.h) + '] /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R /F3 ' + f3 + ' 0 R >>' + (xo ? ' /XObject << ' + xo + ' >>' : '') + ' >> /Contents ' + cobj + ' 0 R >>');
    kids.push(pobj + ' 0 R');
  });
  objs[catalog - 1] = '<< /Type /Catalog /Pages ' + pagesObj + ' 0 R >>';
  objs[pagesObj - 1] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  var info = add('<< /Title (' + npdfEsc(meta.title || 'NAUTILUS') + ') /Producer (NAUTILUS) >>');
  var out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n', offs = [];
  objs.forEach(function(o, i) { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  var xref = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map(function(o) { return ('0000000000' + o).slice(-10) + ' 00000 n \n'; }).join('');
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalog + ' 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
  var u8 = new Uint8Array(out.length); for (var i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 255;
  return u8;
};
</script>

<script>
var ENGINE_URL = 'https://nautilus-red.vercel.app/api/engine';

// fix 2026-10-16: letture manuali di Livornometeo (segnalibro, action=
// livornometeo_submit, stazione separata 'livornometeo_porto') -- quando
// abbastanza fresca (soglia decisa da M: 30 minuti), diventa il valore
// MOSTRATO per Livorno al posto della stima +4.2 (velocita' E direzione, non
// solo la velocita' -- qui e' un dato vero, non serve correggere nulla).
// Oltre i 30 minuti, ricade sulla stima come prima. Stessa identica funzione
// gia' usata in mappa2.html, stessa soglia -- un solo posto da cambiare se
// la soglia va rivista.
var LIVORNOMETEO_FRESH_MIN = 30;
async function getLivornometeoOverride(){
  try {
    var r = await fetch(ENGINE_URL + '?action=bias_history&station=livornometeo_porto&limit=1', {cache:'no-store'});
    var d = await r.json();
    var s = d.samples && d.samples[0];
    if (!s || !s.station || s.station.wind_kt == null || s.station.direction == null) { LM_LAST_AGE_MIN = null; LM_LAST = null; return null; }
    var ageMin = (Date.now() - new Date(s.ts).getTime()) / 60000;
    LM_LAST_AGE_MIN = ageMin; // 2026-10-27: ricordo l'eta' anche se scaduta (per l'etichetta della stima)
    LM_LAST = { speed: s.station.wind_kt, direction: s.station.direction, ts: s.ts }; // 2026-10-27: e anche il valore, per mostrarlo accanto alla stima
    if (ageMin > LIVORNOMETEO_FRESH_MIN) return null;
    return { speed: s.station.wind_kt, direction: s.station.direction, ageMin: Math.round(ageMin) };
  } catch(e) { return null; }
}
// 2026-10-27: STIMA di Livornometeo da Windfinder, con fattore PER DIREZIONE (al posto del
// +4.2 fisso). Stessa tabella dell'engine v2.14.37: rapporto Livornometeo/Windfinder
// ~2.2 da Sud-Sud-Ovest, ~1.7 da Ovest-Nord-Ovest, ~1.5 da Nord-Est/Est (36 ore di medie
// orarie, 23-27/10, correlazione 0.88, validato un giorno fuori: errore 2.4 kn contro 4.1).
// Varia dolcemente con la direzione (nessun salto a cavallo dei settori). PROVVISORIO.
var LM_FACTOR_ANCHORS = [[0, 1.5], [90, 1.5], [150, 2.2], [240, 2.2], [300, 1.7], [360, 1.5]];
// 2026-11-13: TETTO. Il fattore per direzione e' un moltiplicatore e cresce senza limite: il 13/11 a 240 gradi con Windfinder a 24 kn dava 53 kn (x2.2) contro i 25
// reali di Livornometeo; il 12/11 a 144 gradi 14.4 kn davano 30.7 contro 10.4. Sulle 176 coppie Windfinder/Livornometeo (23/10-13/11) il rapporto CALA con la velocita'
// (1.80 sotto i 6 kn, 1.55 tra 6 e 10, 1.33 tra 10 e 14, 1.29 oltre i 14): una retta Livornometeo = 3.3 + 1.08 x Windfinder segue le quattro fasce. Con la velocita' grezza
// (kn) il fattore EFFICACE porta alla stima min(kn x fattore_direzione, 3.3 + 1.08 x kn): puo' solo ridurre la vecchia stima, mai aumentarla. Provvisorio: la taratura
// definitiva e' in corso. Senza kn il comportamento e' quello di prima. Stessa funzione, stesse costanti nel motore, in index, in mappa2 e in previsioni.
var LM_LIN_A = 3.3, LM_LIN_B = 1.08;
function lmFactorForDirBase(deg) {
  if (deg === null || deg === undefined || isNaN(deg)) return 1.8;
  var d = ((Number(deg) % 360) + 360) % 360, A = LM_FACTOR_ANCHORS;
  for (var i = 0; i < A.length - 1; i++) {
    if (d >= A[i][0] && d <= A[i + 1][0]) {
      var t = (A[i + 1][0] === A[i][0]) ? 0 : (d - A[i][0]) / (A[i + 1][0] - A[i][0]);
      return Math.round((A[i][1] + (A[i + 1][1] - A[i][1]) * t) * 100) / 100;
    }
  }
  return 1.8;
}
function lmFactorForDir(deg, kn) {
  var f = lmFactorForDirBase(deg);
  if (kn === undefined || kn === null || isNaN(kn) || Number(kn) <= 0) return f;
  var k = Number(kn), est = Math.min(k * f, LM_LIN_A + LM_LIN_B * k);
  return Math.round((est / k) * 100) / 100;
}
// Eta' dell'ultima lettura Livornometeo (anche se scaduta): serve a dire, accanto alla
// stima, quanto e' vecchia l'ultima lettura vera.
var LM_LAST_AGE_MIN = null;
// 2026-10-27 (v1.12 / v3.12): testi del popup per la stima di Livorno. Il 27/10 M ha fatto notare che il
// titolo "Dato reale stazione, adesso" restava sopra una STIMA, e che l'orario in fondo era quello del
// campione Windfinder mentre "ultima lettura Livornometeo" era un altro dato, due ore prima, senza il
// suo valore. Ora il popup separa: stima mostrata, Windfinder grezzo (con l'eta' del campione) e ultima
// lettura vera di Livornometeo con valore, direzione e ora. lmStaleNote() non e' piu' chiamata: il suo
// testo ("ultima lettura ... fa") finiva attaccato al titolo della stima e si leggeva come un dato di
// Livornometeo; la sostituisce lmEstimateExtra().
var LM_LAST = null; // ultima lettura LivornoPorto# registrata, anche se scaduta: { speed, direction, ts }
function lmHHMM(ts) {
  try { return new Date(ts).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' }); } catch (e) { return ''; }
}

function parseForecastFromText(text, h) {
  if (!text) return null;
  var re = new RegExp('H\\+?' + h + '\\s*:\\s*([0-9]+\\.?[0-9]*)\\s*kn\\s*da\\s*([A-Za-z]+)', 'i');
  var m = text.match(re);

// ==================== Colore continuo per il campo di sfondo (stile Windy) ====================
// Diverso da windColor() (a scatti, per le frecce): qui interpolo linearmente tra
// i punti di ancoraggio per avere una transizione morbida, non a fasce nette.
var FIELD_COLOR_STOPS = [
  [0,  [40, 55, 130]],
  [3,  [30, 110, 175]],
  [6,  [35, 165, 175]],
  [10, [70, 180, 105]],
  [15, [170, 195, 60]],
  [20, [230, 195, 40]],
  [25, [235, 130, 30]],
  [30, [215, 55, 35]],
  [40, [170, 30, 120]]
];
function speedToFieldColor(spd){
  if (spd == null || isNaN(spd)) return 'rgba(0,0,0,0)';
  var stops = FIELD_COLOR_STOPS;
  if (spd <= stops[0][0]) { var c0 = stops[0][1]; return 'rgb(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ')'; }
  for (var i = 0; i < stops.length - 1; i++){
    var a = stops[i], b = stops[i+1];
    if (spd >= a[0] && spd <= b[0]){
      var t = (spd - a[0]) / (b[0] - a[0]);
      var r = Math.round(a[1][0] + (b[1][0]-a[1][0]) * t);
      var g = Math.round(a[1][1] + (b[1][1]-a[1][1]) * t);
      var bl = Math.round(a[1][2] + (b[1][2]-a[1][2]) * t);
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }
  }
  var cl = stops[stops.length-1][1];
  return 'rgb(' + cl[0] + ',' + cl[1] + ',' + cl[2] + ')';
}

// ==================== Stile frecce (identico a mappa.html v1.6.88) ====================
function windColor(s){
  if (s >= 34) return '#cc0000';
  if (s >= 28) return '#ff3300';
  if (s >= 22) return '#ff8800';
  if (s >= 17) return '#ffdd00';
  if (s >= 11) return '#00cc44';
  if (s >= 7)  return '#00ee88';
  if (s >= 4)  return '#44ddcc';
  if (s >= 1)  return '#88ccff';
  return '#aaddff';
}

function drawSingleArrow(ctx, ox, oy, rad, len, lw, colShaft, colHead, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(ox, oy);
  ctx.rotate(rad);
  var hw = len * 0.40;
  var lwOut = lw + 1; // fix 2026-08-01: era lw+2.5, con lo sfondo colorato l'alone sembrava un cerchio
  ctx.beginPath();
  ctx.moveTo(0, len * 0.45);
  ctx.lineTo(0, -len * 0.25);
  ctx.strokeStyle = 'rgba(70,70,70,0.28)';
  ctx.lineWidth = lwOut;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.50);
  ctx.lineTo(-hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.lineTo( hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(70,70,70,0.28)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(70,70,70,0.28)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, len * 0.45);
  ctx.lineTo(0, -len * 0.25);
  ctx.strokeStyle = colShaft;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.50);
  ctx.lineTo(-hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.lineTo( hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.closePath();
  ctx.fillStyle = colHead;
  ctx.fill();
  ctx.restore();
}

// ===== 2026-11-03: BOTTONE NODI (richiesta di M) =====
// Con il bottone acceso, accanto a ogni freccia compare il numero di nodi di quel punto (lo stesso valore
// che la freccia mostra: zone, punti delle stazioni e punti di griglia). Le frecce NON cambiano e non
// spariscono (M: "se serve faccio lo zoom"): i numeri si disegnano solo dove c'e' spazio, in ordine di
// priorita' (zone, poi punti delle stazioni, poi griglia), e quello che si sovrapporrebbe a un numero gia'
// disegnato viene omesso: zoomando compaiono. Si disegnano in un SECONDO passaggio, dopo tutte le frecce,
// cosi' le zone hanno la precedenza anche quando vengono disegnate dopo la griglia (mappa2). Contorno scuro
// attorno alle cifre per leggerle su qualunque sfondo. Il bottone parte spento. Dimensione e aspetto: qui.
var KNOTS_FONT_PX = 13;        // carattere base: da regolare guardando lo schermo (M: "leggermente piu' grande", 3/11)
var KNOTS_FONT_WEIGHT = 500;    // 500 = medio. M (3/11): "in grassetto non sono bellissimi" (era 'bold'). 400 = normale
// 2026-11-06 (M): i numeri sono di due colori: BIANCO = valore nostro (lettura vera della stazione, stima di Livorno, nostra previsione), AZZURRO = modello (griglia OM).
// Regola dell'app (M): un numero sulla mappa e' o il dato VERO, o quello RICALCOLATO, o (se non c'e' altro) quello del MODELLO; il popup del punto dice lo stesso numero
// (qui freccia e popup nascono dallo stesso calcolo, nello stesso giro di disegno di drawAll).
var KNOTS_COLOR_REAL = '#ffffff';
var KNOTS_COLOR_MODEL = '#9ec5e6';
var KNOTS_FONT_FAMILY = '-apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif'; // cifre piu' nitide di DM Mono sul canvas
function knotsFontPx(zoom) { return zoom >= 10 ? KNOTS_FONT_PX + 1 : (zoom >= 8 ? KNOTS_FONT_PX : KNOTS_FONT_PX - 1); }
function knotsLabelPos(q, zoom) {
  // Freccia nascosta (GRID spento, i numeri restano): il numero sta SUL punto, non accanto a una freccia che non c'e'.
  if (q.centered) return { x: q.cx, y: q.cy };
  var zScale = Math.max(0.4, Math.min(1.4, (zoom - 6) * 0.3));
  var ax = Math.sin(q.rad), ay = -Math.cos(q.rad);   // asse della freccia, verso la punta
  var nx = -ay, ny = ax;                              // perpendicolare all'asse
  if (ny < -0.001 || (Math.abs(ny) <= 0.001 && nx < 0)) { nx = -nx; ny = -ny; } // sempre dal lato basso (o destro)
  var off = q.isZone ? Math.max(17, 5 * zScale + q.lw / 2 + 11) : q.lw / 2 + 9; // zone: fuori dal cerchio del marker (raggio 13)
  return { x: q.cx + nx * off, y: q.cy + ny * off };
}
function flushKnotLabels(ctx, zoom, queue) {
  if (!queue || !queue.length) return 0;
  var px = knotsFontPx(zoom), placed = [], drawnN = 0;
  var order = queue.map(function(q, i) { return { q: q, i: i }; }).sort(function(a, b) { return (a.q.prio - b.q.prio) || (a.i - b.i); });
  ctx.save();
  ctx.font = KNOTS_FONT_WEIGHT + ' ' + px + 'px ' + KNOTS_FONT_FAMILY;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
  order.forEach(function(o) {
    var q = o.q, txt = String(Math.round(q.spd)), pos = knotsLabelPos(q, zoom);
    var w = ctx.measureText(txt).width + 5, h = px + 3;
    var r = { x0: pos.x - w / 2, y0: pos.y - h / 2, x1: pos.x + w / 2, y1: pos.y + h / 2 };
    for (var k = 0; k < placed.length; k++) { var s = placed[k]; if (r.x0 < s.x1 && r.x1 > s.x0 && r.y0 < s.y1 && r.y1 > s.y0) return; }
    placed.push(r); drawnN++;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,12,24,0.88)'; ctx.strokeText(txt, pos.x, pos.y);
    ctx.fillStyle = q.real ? KNOTS_COLOR_REAL : KNOTS_COLOR_MODEL; ctx.fillText(txt, pos.x, pos.y);
  });
  ctx.restore();
  queue.length = 0;
  return drawnN;
}

function drawArrow(ctx, cx, cy, dir, spd, gust, alpha, isZone, zoom, prio, kq, noDraw, real){
  if (spd === null || spd === undefined || isNaN(spd)) return;
  if (dir === null || dir === undefined || isNaN(dir)) return;
  var zScale = Math.max(0.4, Math.min(1.4, (zoom - 6) * 0.3));
  var base = isZone ? 28 * zScale : 16 * zScale;
  var extra = Math.min(spd * 1.6, 18) * zScale;
  var len = base + extra;
  var lw = isZone ? Math.max(2, 4 * zScale) : Math.max(1.5, 2.8 * zScale);
  var rad = (dir - 180) * Math.PI / 180;
  var colSpd  = windColor(spd);
  var colGust = (gust != null && !isNaN(gust)) ? windColor(gust) : colSpd;
  if (kq) kq.push({ cx: cx, cy: cy, rad: rad, lw: lw, spd: spd, isZone: !!isZone, centered: !!noDraw, real: !!real, prio: (prio === undefined ? (isZone ? 0 : 2) : prio) });
  if (noDraw) return; // 3/11: GRID spento ma NODI acceso: si accoda solo il numero, la freccia non si disegna

  if (isZone) {
    var off = 5 * zScale;
    var perpX = Math.cos(rad) * off;
    var perpY = Math.sin(rad) * off;
    drawSingleArrow(ctx, cx - perpX, cy - perpY, rad, len, lw, colSpd, colSpd, alpha);
    drawSingleArrow(ctx, cx + perpX, cy + perpY, rad, len, lw, colGust, colGust, alpha);
  } else {
    drawSingleArrow(ctx, cx, cy, rad, len, lw, colSpd, colGust, alpha);
  }
}

// ==================== Flusso animato ====================
var particleState = { active:false, field:null, fieldRes:14, fieldW:0, fieldH:0, particles:[], animFrame:null };
var pCanvas, pCtx;
var fCanvas, fCtx;
var PARTICLE_COUNT = 600;
var MAX_AGE = 60;

function gatherSources(refW, refH){
  var omSources = [];
  state.gridPoints.forEach(function(g){
    var px = map.latLngToContainerPoint([g.lat, g.lon]);
    if (px.x < -300 || px.x > refW+300 || px.y < -300 || px.y > refH+300) return;
    var gv = omValueForOffset(g, state.currentOffset);
    if (!gv || gv.dir == null || gv.speed == null || isNaN(gv.dir) || isNaN(gv.speed)) return;
    var rad = gv.dir * Math.PI / 180;
    omSources.push({ x:px.x, y:px.y, u:-Math.sin(rad)*gv.speed, v:Math.cos(rad)*gv.speed });
  });

  var nauSources = [];
  state.zonePoints.forEach(function(z){
    var v = ourValueForOffset(z, state.currentOffset);
    if (!v || v.dir == null || v.speed == null || isNaN(v.dir) || isNaN(v.speed)) return;
    var px = map.latLngToContainerPoint([z.lat, z.lon]);
    var rad = v.dir * Math.PI / 180;
    nauSources.push({ x:px.x, y:px.y, u:-Math.sin(rad)*v.speed, v:Math.cos(rad)*v.speed, w:10.0 });
  });
  return { om: omSources, nau: nauSources };
}

function buildVectorField(){
  var W = pCanvas.width, H = pCanvas.height;
  var res = particleState.fieldRes;
  var cols = Math.ceil(W / res);
  var rows = Math.ceil(H / res);
  particleState.fieldW = cols;
  particleState.fieldH = rows;
  var EPS = 1e-10;

  var src = gatherSources(W, H);
  var omSources = src.om, nauSources = src.nau;

  if (omSources.length === 0 && nauSources.length === 0){ particleState.field = null; return; }

  var field = new Float32Array(cols * rows * 2);
  for (var row = 0; row < rows; row++){
    for (var col = 0; col < cols; col++){
      var cx = col * res + res/2, cy = row * res + res/2;
      var sumU = 0, sumV = 0, sumW = 0;
      for (var ni = 0; ni < nauSources.length; ni++){
        var n = nauSources[ni];
        var dxn = cx-n.x, dyn = cy-n.y, d2n = dxn*dxn+dyn*dyn;
        if (d2n < 900) d2n = 900;
        var wn = n.w/d2n; sumU += n.u*wn; sumV += n.v*wn; sumW += wn;
      }
      for (var oi = 0; oi < omSources.length; oi++){
        var o = omSources[oi];
        var dxo = cx-o.x, dyo = cy-o.y, d2o = dxo*dxo+dyo*dyo;
        if (d2o < 900) d2o = 900;
        var wo = 1.0/d2o; sumU += o.u*wo; sumV += o.v*wo; sumW += wo;
      }
      var idx = (row * cols + col) * 2;
      if (sumW > EPS){ field[idx] = sumU/sumW; field[idx+1] = sumV/sumW; }
    }
  }
  particleState.field = field;
}

// ==================== Campo colorato di sfondo -- interpolazione bilineare sulla griglia OM ====================
// Approccio cambiato 2026-08-01: il precedente (punti sparsi pesati per distanza +
// blur) creava sempre "isole" intorno alle zone (poche, peso alto) sopra lo sfondo
// denso OM (400 punti), qualunque parametro di sfumatura si usasse -- difetto
// strutturale del metodo, non un numero da tarare. La griglia OM e' pero' GIA'
// regolare (passo fisso 0.25 gradi): basta una vera interpolazione bilineare tra i
// 4 punti griglia piu' vicini, continua per costruzione, senza pesi/blur. Le zone
// nostre restano SOLO nelle frecce, non entrano piu' nel colore di sfondo.
var gridLookup = { lats:[], lons:[], numLat:0, numLon:0 };

function buildGridLookup(){
  if (!state.gridPoints.length) { gridLookup = { lats:[], lons:[], numLat:0, numLon:0 }; return; }
  var lons = [];
  var firstLat = state.gridPoints[0].lat;
  for (var i = 0; i < state.gridPoints.length; i++){
    if (state.gridPoints[i].lat !== firstLat) break;
    lons.push(state.gridPoints[i].lon);
  }
  var numLon = lons.length;
  var numLat = Math.floor(state.gridPoints.length / numLon);
  var lats = [];
  for (var r = 0; r < numLat; r++) lats.push(state.gridPoints[r * numLon].lat);
  gridLookup = { lats:lats, lons:lons, numLat:numLat, numLon:numLon };
}

// Velocita' interpolata bilinearmente alla posizione lat/lon esatta, per l'offset
// corrente. Ritorna null se fuori dalla copertura griglia o dato mancante.
function bilinearGridSpeed(lat, lon, offset){
  var lats = gridLookup.lats, lons = gridLookup.lons;
  if (lats.length < 2 || lons.length < 2) return null;
  if (lat < lats[0] || lat > lats[lats.length-1] || lon < lons[0] || lon > lons[lons.length-1]) return null;
  var li = 0; while (li < lats.length-2 && lats[li+1] <= lat) li++;
  var lj = 0; while (lj < lons.length-2 && lons[lj+1] <= lon) lj++;
  var tLat = (lat - lats[li]) / (lats[li+1] - lats[li]);
  var tLon = (lon - lons[lj]) / (lons[lj+1] - lons[lj]);
  function speedAt(latIdx, lonIdx){
    var g = state.gridPoints[latIdx * gridLookup.numLon + lonIdx];
    if (!g) return null;
    var v = omValueForOffset(g, offset);
    return v ? v.speed : null;
  }
  var s00 = speedAt(li,lj), s10 = speedAt(li+1,lj), s01 = speedAt(li,lj+1), s11 = speedAt(li+1,lj+1);
  if (s00 == null || s10 == null || s01 == null || s11 == null) return null;
  var top = s00*(1-tLon) + s01*tLon;
  var bot = s10*(1-tLon) + s11*tLon;
  return top*(1-tLat) + bot*tLat;
}

var colorField = { data:null, res:8, w:0, h:0 };

function buildColorField(){
  if (!fCanvas) return;
  buildGridLookup();
  var W = fCanvas.width, H = fCanvas.height;
  var res = colorField.res;
  var cols = Math.ceil(W / res);
  var rows = Math.ceil(H / res);
  colorField.w = cols;
  colorField.h = rows;
  var offset = state.currentOffset;

  var data = new Float32Array(cols * rows);
  for (var row = 0; row < rows; row++){
    for (var col = 0; col < cols; col++){
      var cx = col * res + res/2, cy = row * res + res/2;
      var ll = map.containerPointToLatLng([cx, cy]);
      var spd = bilinearGridSpeed(ll.lat, ll.lng, offset);
      data[row*cols+col] = (spd == null) ? -1 : spd;
    }
  }
  colorField.data = data;
}

// Disegna il campo continuo -- bilineare per costruzione, blur minimo solo per
// smussare il bordo a scalini dei pixel della griglia fine (non per nascondere isole).
function drawField(){
  if (!fCtx) return;
  var W = fCanvas.width, H = fCanvas.height;
  fCtx.clearRect(0, 0, W, H);
  if (!colorField.data) return;
  var res = colorField.res;
  var cols = colorField.w, rows = colorField.h;
  for (var row = 0; row < rows; row++){
    for (var col = 0; col < cols; col++){
      var spd = colorField.data[row * cols + col];
      if (spd < 0) continue;
      fCtx.fillStyle = speedToFieldColor(spd);
      fCtx.fillRect(col * res, row * res, res + 1, res + 1);
    }
  }
}

function sampleField(px, py){
  var res = particleState.fieldRes;
  var cols = particleState.fieldW, rows = particleState.fieldH;
  if (!particleState.field) return {u:0, v:0, spd:0};
  var col = px / res, row = py / res;
  var c0 = Math.floor(col), c1 = c0+1, r0 = Math.floor(row), r1 = r0+1;
  if (c0 < 0 || r0 < 0 || c1 >= cols || r1 >= rows) return {u:0, v:0, spd:0};
  var tc = col - c0, tr = row - r0;
  function get(r,c){ var i=(r*cols+c)*2; return {u:particleState.field[i], v:particleState.field[i+1]}; }
  var f00=get(r0,c0), f10=get(r1,c0), f01=get(r0,c1), f11=get(r1,c1);
  var u = f00.u*(1-tc)*(1-tr) + f01.u*tc*(1-tr) + f10.u*(1-tc)*tr + f11.u*tc*tr;
  var v = f00.v*(1-tc)*(1-tr) + f01.v*tc*(1-tr) + f10.v*(1-tc)*tr + f11.v*tc*tr;
  return { u:u, v:v, spd:Math.sqrt(u*u+v*v) };
}

function spawnParticle(){
  return { x: Math.random()*pCanvas.width, y: Math.random()*pCanvas.height, age: Math.floor(Math.random()*MAX_AGE) };
}

function particleColor(spd){
  if (spd >= 34) return 'rgba(204,0,0,0.9)';
  if (spd >= 28) return 'rgba(255,51,0,0.9)';
  if (spd >= 22) return 'rgba(255,136,0,0.9)';
  if (spd >= 17) return 'rgba(220,200,0,0.85)';
  if (spd >= 11) return 'rgba(0,180,60,0.85)';
  if (spd >=  7) return 'rgba(0,160,100,0.8)';
  if (spd >=  4) return 'rgba(30,100,200,0.75)';
  if (spd >=  1) return 'rgba(60,60,180,0.7)';
  return 'rgba(80,80,160,0.5)';
}

function animateParticles(){
  if (!particleState.active) return;
  var W = pCanvas.width, H = pCanvas.height;
  pCtx.globalCompositeOperation = 'destination-out';
  pCtx.globalAlpha = 0.04;
  pCtx.fillRect(0, 0, W, H);
  pCtx.globalCompositeOperation = 'source-over';
  pCtx.globalAlpha = 1.0;
  var speedScale = 0.10;
  particleState.particles.forEach(function(p, i){
    var fv = sampleField(p.x, p.y);
    if (fv.spd < 0.3 || p.age > MAX_AGE){ particleState.particles[i] = spawnParticle(); return; }
    var nx = p.x + fv.u * speedScale, ny = p.y + fv.v * speedScale;
    if (nx < 0 || nx > W || ny < 0 || ny > H){ particleState.particles[i] = spawnParticle(); return; }
    pCtx.beginPath();
    pCtx.moveTo(p.x, p.y);
    pCtx.lineTo(nx, ny);
    pCtx.strokeStyle = particleColor(fv.spd);
    pCtx.lineWidth = fv.spd > 22 ? 2.0 : fv.spd > 11 ? 1.6 : 1.2;
    pCtx.stroke();
    p.x = nx; p.y = ny; p.age++;
  });
  particleState.animFrame = requestAnimationFrame(animateParticles);
}

function startParticles(){
  if (!particleState.field) return;
  if (particleState.animFrame) cancelAnimationFrame(particleState.animFrame);
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particleState.particles = [];
  for (var i = 0; i < PARTICLE_COUNT; i++) particleState.particles.push(spawnParticle());
  animateParticles();
}

function stopParticles(){
  if (particleState.animFrame){ cancelAnimationFrame(particleState.animFrame); particleState.animFrame = null; }
  if (pCtx) pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
}

function resizeParticleCanvas(){
  if (!pCanvas) return;
  var size = map.getSize();
  pCanvas.width = size.x; pCanvas.height = size.y;
  if (fCanvas) { fCanvas.width = size.x; fCanvas.height = size.y; }
}

function rebuildAndAnimate(){
  buildVectorField();
  buildColorField();
  drawField();
  if (particleState.active) startParticles();
}

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2aye_1_6aa06c5e5eb9da4db55be03f', {
    subdomains: 'abcd', maxZoom: 12
  }).addTo(map);

  map.on('move resize zoom', function(){

    // lo pulisce sempre, anche a parita' di dimensione -- comportamento del
    // browser, non un bug nostro) ma qui non veniva mai ridipinto: bastava
    // un "move" (anche l'autoPan di un popup) per far sparire il colore di
    // sfondo, lasciando solo le frecce. drawField() ridipinge da colorField.data
    // gia' calcolato, non serve ricalcolarlo (rebuildAndAnimate() completo,
    // piu' pesante, resta per quando i dati vanno davvero ricalcolati).
    drawField();
    drawAll();
  });
  map.on('moveend zoomend', function(){ rebuildAndAnimate(); });
  resizeCanvas();
}

async function fetchJson(url){
  var r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ==================== Caricamento dati ====================
async function loadGrid(){
  var lats = GRID.map(function(p){ return p.lat; }).join(',');
  var lons = GRID.map(function(p){ return p.lon; }).join(',');
  var d = await fetchJson(ENGINE_URL + '?action=grid&lats=' + lats + '&lons=' + lons);
  state.gridPoints = d.points || [];
}

async function loadStationsSnapshot(){
  var d = await fetchJson(ENGINE_URL + '?action=stations_snapshot');
  state.stationsNow = d.stations || {};
}

async function loadZones(){
  var zd = await fetchJson(ENGINE_URL + '?action=zones');
  var zones = (zd.zones || []).filter(function(z){ return z.bias_station; });
  var results = await Promise.allSettled(zones.map(function(z){
    // fix 2026-09-17 (D20): aggiunta forecast_stats in parallelo a
    // predict_history -- serve current_bias per calcolare l'affidabilita'
    // (stessa soglia di decadimento.html, funzione judge sopra) da mostrare
    // vicino a ogni freccia nostra.
    return Promise.all([
      fetchJson(ENGINE_URL + '?action=predict_history&zone=' + encodeURIComponent(z.key) + '&limit=1'),
      fetchJson(ENGINE_URL + '?action=forecast_stats&zone=' + encodeURIComponent(z.key)).catch(function(){ return null; })
    ]).then(function(both){
      var ph = both[0], fs = both[1];
      var item = (ph.predictions || [])[0];
      var p = item ? (item.prediction || item) : null;
      return { zone: z, p: p, fs: fs };
    });
  }));
  var zonePoints = [];
  results.forEach(function(r){
    if (r.status !== 'fulfilled' || !r.value.p) return;
    var z = r.value.zone, p = r.value.p, fs = r.value.fs;
    var text = p.prediction_text || '';
    var cb = (fs && fs.current_bias) ? fs.current_bias : {};
    var entry = {
      lat: z.lat, lon: z.lon, name: z.name, key: z.key,
      biasStation: z.bias_station,
      genDate: p.generated_at ? new Date(p.generated_at) : null
    };
    [1,3,6,9,12].forEach(function(h){
      var speedField = p['forecast_h' + h]; // gia' corretto (bias applicato)
      var parsed = parseForecastFromText(text, h);
      entry['h' + h] = (speedField != null && parsed) ? { speed: speedField, dir: parsed.dir } : null;
      var c = cb['h' + h];
      entry['judge_h' + h] = c ? judge(c.n, c.mae, c.std) : null;
      // fix 2026-09-17: scostamento medio (current_bias.mean) -- stesso dato
      // gia' mostrato in decadimento.html, richiesto da M anche qui nei popup.
      entry['bias_h' + h] = (c && c.mean != null) ? c.mean : null;
    });
    zonePoints.push(entry);
  });
  state.zonePoints = zonePoints;
}

// ==================== Bottoni ora ====================
function buildHourButtons(){
  var nowFloored = floorToHour(new Date());
  var buttons = [];
  for (var i = 0; i <= 12; i++){
    buttons.push({ offset: i, date: new Date(nowFloored.getTime() + i * 3600000) });
  }
  state.hourButtons = buttons;
}

// Vero se questa zona ha una previsione nostra valida per questo bottone (scarto
// dall'ULTIMO PREDICT, non da adesso -- l'"orologio nostro").
function ourValueForOffset(zoneEntry, offset){
  if (!zoneEntry.genDate || offset === 0) return null; // bottone "ora" non mostra mai l'AI
  var btn = state.hourButtons[offset];
  if (!btn) return null;
  var genFloored = floorToHour(zoneEntry.genDate);
  var offsetFromPredict = Math.round((btn.date.getTime() - genFloored.getTime()) / 3600000);
  if ([1,3,6,9,12].indexOf(offsetFromPredict) === -1) return null;
  var v = zoneEntry['h' + offsetFromPredict];
  if (!v) return null;
  // fix 2026-09-17 (D20): porta con se' anche il giudizio di affidabilita'
  // per QUESTO specifico orizzonte -- serve a drawAll per il pallino colorato.
  return { speed: v.speed, dir: v.dir, judge: zoneEntry['judge_h' + offsetFromPredict] || null, bias: zoneEntry['bias_h' + offsetFromPredict] };
}

// OM per questo bottone -- sempre relativo ad "adesso" (l'"orologio OM"), mai al predict.
function omValueForOffset(gridPoint, offset){
  if (offset === 0) return { speed: gridPoint.speed, dir: gridPoint.dir, gust: gridPoint.gust };
  return (gridPoint.forecast && gridPoint.forecast['h' + offset]) ? gridPoint.forecast['h' + offset] : null;
}

function renderHourBar(){
  var bar = document.getElementById('hourbar');
  bar.innerHTML = '';
  state.hourButtons.forEach(function(btn){
    var b = document.createElement('button');
    b.className = 'hbtn' + (btn.offset === 0 ? ' now' : '') + (btn.offset === state.currentOffset ? ' active' : '');
    // ha almeno una zona con previsione nostra valida per questo bottone?
    var hasOur = btn.offset !== 0 && state.zonePoints.some(function(z){ return !!ourValueForOffset(z, btn.offset); });
    if (hasOur) b.className += ' has-our';
    var todayLabel = romeDayLabel(new Date());
    var btnDayLabel = romeDayLabel(btn.date);
    var dayMark = (btnDayLabel !== todayLabel) ? ('<span class="daymark">' + btnDayLabel + '</span>') : '';
    b.innerHTML = romeHourLabel(btn.date) + dayMark;
    b.addEventListener('click', function(){
      state.currentOffset = btn.offset;
      renderHourBar();
      drawAll();
      rebuildAndAnimate();
    });
    bar.appendChild(b);
  });
}

function nearestGridPoint(lat, lon){
  var best = null, bestD = Infinity;
  state.gridPoints.forEach(function(g){
    var d = Math.pow(g.lat-lat,2) + Math.pow(g.lon-lon,2);
    if (d < bestD) { bestD = d; best = g; }
  });
  return best;
}

// ==================== Disegno ====================
// 2026-11-18: T (facoltativo) = bersaglio alternativo per il PDF: { ctx, w, h, zoom, offset, pt(lat,lon)->{x,y}, labels:[] }.
// Perche' qui e non una copia: il PDF deve mostrare ESATTAMENTE i valori che si vedono sullo schermo (Livorno vero/media/stima, nostra previsione, ripiego modello,
// griglia), quindi usa la stessa scelta di sorgente e la stessa regola anti-sovrapposizione. Senza T il comportamento e' identico a prima.
async function drawAll(T){
  var tctx = T ? T.ctx : ctx;
  if (!tctx) return;
  if (!T) ctx.clearRect(0,0,canvas.width,canvas.height); // col PDF la cartina e' gia' disegnata sotto: non si cancella
  var bounds = T ? null : map.getBounds();
  var zoom = T ? T.zoom : map.getZoom();
  var minPx = zoom >= 10 ? 18 : zoom >= 9 ? 22 : 30;
  var drawn = [];
  var offset = T ? T.offset : state.currentOffset;
  var showK = T ? true : state.showKnots;          // sulla carta non c'e' il tocco: i numeri dei nodi ci sono sempre
  var showG = T ? true : state.showGridArrows;
  var curZone = null;                              // zona in corso nel ciclo sotto (serve per scrivere il nome sul PDF)
  var kq = []; // 3/11: numeri dei nodi, accodati dalle frecce e disegnati alla fine (locale: drawAll e' asincrona)

  function tryDraw(lat, lon, dir, spd, gust, isZone, prio, noDraw){
    var pt;
    if (T) { pt = T.pt(lat, lon); if (pt.x < 0 || pt.y < 0 || pt.x > T.w || pt.y > T.h) return false; }
    else { if (!bounds.contains([lat, lon])) return false; pt = map.latLngToContainerPoint([lat, lon]); }
    for (var i = 0; i < drawn.length; i++){
      var dx = pt.x - drawn[i].x, dy = pt.y - drawn[i].y;
      if (Math.sqrt(dx*dx+dy*dy) < minPx) return false;
    }
    drawn.push(pt);
    drawArrow(tctx, pt.x, pt.y, dir, spd, gust, 0.95, isZone, zoom, prio, showK ? kq : null, noDraw, prio === 0); // real: prio 0 = valore nostro (lettura vera, stima, nostra previsione); 1 e 2 = modello
    if (T && curZone) T.labels.push({ x: pt.x, y: pt.y, name: curZone.name, model: prio !== 0 });
    return true;
  }

  // Zone nostre per prime (vincono lo spazio)
  // fix 2026-10-16: forEach -> for sequenziale, serve poter fare await dentro
  // (per controllare una lettura Livornometeo fresca) senza che il resto del
  // disegno parta prima che il controllo sia finito.
  for (var zi = 0; zi < state.zonePoints.length; zi++) {
    var z = state.zonePoints[zi];
    curZone = z;
    if (offset === 0) {
      // bottone "ora": dato reale stazione, mai AI
      var st = state.stationsNow[z.biasStation];
      if (st && st.wind_kt != null && st.direction != null) {
        // fix 2026-10-16: se esiste una lettura Livornometeo fresca (<=30min,
        // M via segnalibro), quella diventa il valore PRINCIPALE -- velocita'
        // E direzione vere, non piu' solo la stima +4.2 (D16, 15/9). La stima
        // resta come ripiego quando non c'e' nulla di fresco.
        var stSpd = st.wind_kt, stDir = st.direction, stGust = st.gust_kt, stPrio = 0;
        if (z.biasStation === 'livorno_porto') {
          var lnD = await getLivornoNowPv();
          var lmOvD = lnD ? null : await getLivornometeoOverride();
          if (lnD) { stSpd = lnD.valore.velocita_kn; stDir = lnD.valore.direzione; stGust = lnPvGust(lnD.valore); if (lnPvInfo(lnD).model) stPrio = 1; } // 2026-11-16: valore deciso dall'engine; AROME = modello (azzurro)
          else if (lmOvD) { stSpd = lmOvD.speed; stDir = lmOvD.direction; stGust = null; } // lettura vera: la raffica di Windfinder non le appartiene
          else {
            var lmFD = lmFactorForDir(stDir, st.wind_kt); // 2026-11-13: con il tetto sulla velocita'
            stSpd = Math.round(st.wind_kt * lmFD * 10) / 10;
            if (stGust != null && !isNaN(stGust)) stGust = Math.max(Math.round(stGust * lmFD * 10) / 10, stSpd); // 2026-11-13: la raffica si scala come la velocita' (l'index mostrava raffica 30 con vento stimato 53) e non scende sotto il vento
          }
        }
        tryDraw(z.lat, z.lon, stDir, stSpd, stGust, true, stPrio);
        continue;
      }
      // nessuna lettura reale recente -- cade sull'OM del punto griglia piu' vicino
      var g0 = nearestGridPoint(z.lat, z.lon);
      if (g0) tryDraw(z.lat, z.lon, g0.dir, g0.speed, g0.gust, false, 1);
      continue;
    }
    var v = ourValueForOffset(z, offset);
    if (v) {
      tryDraw(z.lat, z.lon, v.dir, v.speed, null, true, 0);
    } else {
      var g = nearestGridPoint(z.lat, z.lon);
      if (g) {
        var gv = omValueForOffset(g, offset);
        if (gv) tryDraw(z.lat, z.lon, gv.dir, gv.speed, gv.gust, false, 1);
      }
    }
  }

  // Griglia OM di sfondo -- sempre dall'orologio OM (relativo ad adesso)
  // 3/11 (M): con NODI acceso la griglia entra nel ciclo anche a GRID spento: la freccia non si disegna (noDraw)
  // ma il numero della velocita' si', cosi' spegnere GRID non fa sparire i valori.
  curZone = null;
  if (showG || showK) {
    state.gridPoints.forEach(function(g){
      var gv = omValueForOffset(g, offset);
      if (!gv) return;
      tryDraw(g.lat, g.lon, gv.dir, gv.speed, gv.gust, false, 2, !showG);
    });
  }

  if (showK) flushKnotLabels(tctx, zoom, kq); // 3/11: numeri dopo tutte le frecce, zone per prime
  if (!T) await updateZoneMarkerPopups();
}

// D20 (17/9): un marker Leaflet invisibile per zona (solo per il tocco, non
// per la vista -- la freccia disegnata sul canvas resta l'unica cosa visibile),
// con un popup che si aggiorna ad ogni cambio di orario. Creati una volta sola,
// il contenuto del popup viene aggiornato ogni volta che drawAll() ridisegna.
function ensureZoneMarkers(){
  state.zonePoints.forEach(function(z){
    if (state.zoneMarkers[z.key]) return;
    var mk = L.circleMarker([z.lat, z.lon], {
      radius: 14, fillOpacity: 0.001, opacity: 0, weight: 0, interactive: true, pane: 'markerPane'
    }).addTo(map);
    mk.bindPopup('<div style="font-family:\'DM Mono\',monospace;font-size:0.7rem;min-width:180px">Caricamento...</div>', { autoPan: false });
    state.zoneMarkers[z.key] = mk;
  });
}

// Contenuto del popup -- stessa logica di scelta usata in drawAll per decidere
// cosa mostrare (dato reale stazione / nostra previsione / ripiego OM), ma qui
// in forma testuale con il giudizio di affidabilita' per intero (colore + testo),
// non solo un pallino piccolo sulla mappa.
async function updateZoneMarkerPopups(){
  var offset = state.currentOffset;
  for (var zi2 = 0; zi2 < state.zonePoints.length; zi2++) {
    var z = state.zonePoints[zi2];
    var mk = state.zoneMarkers[z.key];
    if (!mk) continue;
    var html;
    if (offset === 0) {
      var st = state.stationsNow[z.biasStation];
      if (st && st.wind_kt != null && st.direction != null) {
        // fix 2026-10-16: lettura Livornometeo fresca (<=30min) ha priorita'
        // sulla stima +4.2 -- vedi nota estesa in drawAll.
        var stSpd = st.wind_kt, stDir = st.direction, freshNote = '';
        // 2026-10-27: il titolo era fisso ("Dato reale stazione, adesso") anche quando sotto c'era una STIMA
        // (Livorno senza lettura Livornometeo fresca): si leggeva come un dato reale e di adesso. Ora cambia col caso.
        var popHdr = 'Dato reale stazione, adesso', popHdrCol = '#fff';
        if (z.biasStation === 'livorno_porto') {
          var lnP = await getLivornoNowPv();
          var lmOvP = lnP ? null : await getLivornometeoOverride();

function updateFreshness(){

async function loadAll(){
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Aggiorno...';
  try {
    await Promise.all([loadGrid(), loadZones(), loadStationsSnapshot()]);
    buildHourButtons();
    ensureZoneMarkers();
    state.lastFetch = new Date();
    updateFreshness();
    statusEl.textContent = state.zonePoints.length + ' zone, ' + state.gridPoints.length + ' punti griglia';
    renderHourBar();
    drawAll();
    rebuildAndAnimate();

}

// ==================== Esportazione XLS -- un foglio per fascia oraria ====================
async function exportXLS(){
  var btn = document.getElementById('btn-xls');
  var oldText = btn.innerHTML;
  btn.innerHTML = '...';
  // fix 2026-10-16: presa una sola volta, prima dei due cicli sotto -- non
  // cambia nei pochi secondi che l'export impiega, non serve richiederla a
  // ogni zona/fascia oraria (ne' convertire i forEach in for per via dell'await).
  var lnX = await getLivornoNowPv(true);
  var lmOvX = lnX ? null : await getLivornometeoOverride();
  try {
    var wb = XLSX.utils.book_new();
    state.hourButtons.forEach(function(hb){
      var rows = [];
      rows.push(['tipo','nome/lat_lon','lat','lon','fonte','speed_kn','dir_deg','gust_kn']);

      // Zone nostre -- stessa logica di drawAll: bottone 0 = stazioni reali,
      // bottoni futuri = nostra previsione se disponibile, altrimenti OM piu' vicino
      state.zonePoints.forEach(function(z){
        if (hb.offset === 0) {
          var st = state.stationsNow[z.biasStation];
          if (st && st.wind_kt != null) {
            // fix 2026-10-16: lettura Livornometeo fresca (<=30min) ha
            // priorita' sulla stima +4.2 -- vedi nota estesa in drawAll.
            var stSpd = st.wind_kt, stDir = st.direction, stGustX = st.gust_kt, stFonte = 'stazione reale (' + (st.age_min != null ? st.age_min + 'min fa' : '?') + ')';
            if (z.biasStation === 'livorno_porto') {
              if (lnX) { stSpd = lnX.valore.velocita_kn; stDir = lnX.valore.direzione; stGustX = lnPvGust(lnX.valore); stFonte = lnPvInfo(lnX).xls; } // 2026-11-16: valore deciso dall'engine (livorno_now)
              else if (lmOvX) { stSpd = lmOvX.speed; stDir = lmOvX.direction; stGustX = null; stFonte = 'LivornoPorto# diretto (' + lmOvX.ageMin + 'min fa)'; }
              else { var lmFX = lmFactorForDir(stDir, st.wind_kt); stSpd = Math.round(st.wind_kt * lmFX * 10) / 10; if (stGustX != null && !isNaN(stGustX)) stGustX = Math.max(Math.round(stGustX * lmFX * 10) / 10, stSpd); stFonte = 'stima da Windfinder \u00d7' + lmFX.toFixed(1); } // 2026-11-13: tetto sulla velocita' e raffica scalata
            }
            rows.push(['zona', z.name, z.lat, z.lon, stFonte, stSpd, stDir, stGustX]);
          } else {
            var g0 = nearestGridPoint(z.lat, z.lon);
            var gv0 = g0 ? omValueForOffset(g0, 0) : null;
            rows.push(['zona', z.name, z.lat, z.lon, 'OM (nessuna lettura reale)', gv0 ? gv0.speed : '', gv0 ? gv0.dir : '', gv0 ? gv0.gust : '']);
          }
          return;
        }
        var v = ourValueForOffset(z, hb.offset);
        if (v) {
          rows.push(['zona', z.name, z.lat, z.lon, 'nostra previsione AI', v.speed, v.dir, '']);
        } else {
          var g = nearestGridPoint(z.lat, z.lon);
          var gv = g ? omValueForOffset(g, hb.offset) : null;
          rows.push(['zona', z.name, z.lat, z.lon, 'OM (nessun orizzonte nostro)', gv ? gv.speed : '', gv ? gv.dir : '', gv ? gv.gust : '']);
        }
      });

      // Griglia OM completa
      state.gridPoints.forEach(function(g){
        var gv = omValueForOffset(g, hb.offset);
        if (!gv) return;
        rows.push(['griglia', g.lat.toFixed(2) + ',' + g.lon.toFixed(2), g.lat, g.lon, 'OM', gv.speed, gv.dir, gv.gust]);
      });

      var ws = XLSX.utils.aoa_to_sheet(rows);
      var dayLbl = romeDayLabel(hb.date);
      var hourLbl = romeHourLabel(hb.date);
      var sheetName = hourLbl + '_' + dayLbl.replace('/', '-');
      XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31)); // limite Excel 31 caratteri
    });
    var fname = 'nautilus_previsioni_' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.xlsx';
    XLSX.writeFile(wb, fname);
  } catch(e) {
    alert('Errore esportazione: ' + e.message);
  } finally {
    btn.innerHTML = oldText;
  }
}

// ==================== PDF della mappa (2026-11-18, M) ====================
// Una pagina A4 verticale con la mappa della fascia oraria selezionata, su tutta l'area che trattiamo (non l'inquadratura dello schermo), con frecce e numeri
// come a video e il nome di ogni zona (sulla carta non c'e' il tocco per il popup). In alto, grande e rosso, quando e' stato scaricato: senza segnale il
// rischio e' leggere un foglio vecchio credendolo di adesso. La cartina e le frecce si disegnano su un canvas fuori schermo con la stessa drawAll della pagina.
var PDF_TILE_Z = 8;            // tessere @2x di livello 8 = densita' di un livello 9 (circa 364 px per grado di longitudine)
var PDF_SCALE = 2.0;           // pixel del canvas per "pixel schermo": le frecce hanno dimensioni pensate per lo schermo, qui si ingrandiscono in proporzione
var PDF_ARROW_ZOOM = 9;        // livello che regola lunghezza frecce e distanza minima tra loro (come a video quando si ingrandisce un po')
function pdfWorld(){ return 256 * Math.pow(2, PDF_TILE_Z + 1); }
function pdfWx(lon){ return (lon + 180) / 360 * pdfWorld(); }
function pdfWy(lat){ var r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * pdfWorld(); }
function pdfLon(wx){ return wx / pdfWorld() * 360 - 180; }
function pdfLat(wy){ var n = Math.PI - 2 * Math.PI * wy / pdfWorld(); return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); }

function pdfLoadTile(z, x, y){
  return new Promise(function(res){
    var img = new Image(), done = false;
    function fin(v){ if (!done){ done = true; res(v); } }
    img.crossOrigin = 'anonymous'; // senza, il canvas diventa "contaminato" e non si puo' trasformare in immagine
    img.onload = function(){ fin(img); };
    img.onerror = function(){ fin(null); };
    setTimeout(function(){ fin(null); }, 15000);
    img.src = 'https://' + 'abcd'.charAt((x + y) % 4) + '.basemaps.cartocdn.com/rastertiles/voyager/' + z + '/' + x + '/' + y + '@2x.png?key=cb1_2aye_1_6aa06c5e5eb9da4db55be03f';
  });
}

async function exportMapPdf(){
  var btn = document.getElementById('btn-pdf'), oldText = btn.innerHTML;
  btn.innerHTML = '...';
  // 2026-11-18: il PDF si apre in una scheda NUOVA, aperta qui subito (nel gesto del tocco) e riempita a fine lavoro. Su Safari iPad il vecchio
  // "link con download" caricava il PDF nella finestra di previsioni, facendo perdere la pagina; una scheda aperta dopo i calcoli verrebbe bloccata.
  var pdfWin = null;
  try { pdfWin = window.open('', '_blank'); if (pdfWin) pdfWin.document.write('<title>NAUTILUS PDF</title><body style="font-family:sans-serif;background:#0a1a2e;color:#fff;padding:24px">Preparo il PDF...</body>'); } catch (e0) { pdfWin = null; }
  try {
    if (!state.zonePoints.length) throw new Error('dati non ancora caricati');
    var offset = state.currentOffset, hb = state.hourButtons[offset];
    var page = { w: 595.28, h: 841.89 }, mxp = 15, topH = 84, botH = 92;
    var imgWpt = page.w - 2 * mxp, imgHpt = page.h - topH - botH, ratio = imgWpt / imgHpt;
    // area: tutta la mappa che trattiamo = l'estensione della griglia modello (40.0-44.6 N, 7.4-12.5 E), non solo le zone nostre (prima si tagliavano Bonifacio, Capalbio...)
    var la0 = 90, la1 = -90, lo0 = 180, lo1 = -180;
    GRID.forEach(function(g){ la0 = Math.min(la0, g.lat); la1 = Math.max(la1, g.lat); lo0 = Math.min(lo0, g.lon); lo1 = Math.max(lo1, g.lon); });
    state.zonePoints.forEach(function(z){ la0 = Math.min(la0, z.lat); la1 = Math.max(la1, z.lat); lo0 = Math.min(lo0, z.lon); lo1 = Math.max(lo1, z.lon); });
    var padLa = 0.12, padLo = 0.12;
    var x0 = pdfWx(lo0 - padLo), x1 = pdfWx(lo1 + padLo), y0 = pdfWy(la1 + padLa), y1 = pdfWy(la0 - padLa);
    var w0 = x1 - x0, h0 = y1 - y0;
    if (w0 / h0 < ratio) { var nw = h0 * ratio; x0 -= (nw - w0) / 2; x1 = x0 + nw; } else { var nh = w0 / ratio; y0 -= (nh - h0) / 2; y1 = y0 + nh; }
    var W = Math.round(x1 - x0), H = Math.round(y1 - y0);
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var c = cv.getContext('2d');
    c.fillStyle = '#cfe3ee'; c.fillRect(0, 0, W, H);
    // cartina
    var tz = PDF_TILE_Z, tsz = pdfWorld() / Math.pow(2, tz), jobs = [];
    for (var ty = Math.floor(y0 / tsz); ty <= Math.floor((y1 - 1) / tsz); ty++)
      for (var tx = Math.floor(x0 / tsz); tx <= Math.floor((x1 - 1) / tsz); tx++) jobs.push({ tx: tx, ty: ty });
    var imgs = await Promise.all(jobs.map(function(j){ return pdfLoadTile(tz, j.tx, j.ty); }));
    var okTiles = 0;
    jobs.forEach(function(j, i){ if (imgs[i]) { c.drawImage(imgs[i], j.tx * tsz - x0, j.ty * tsz - y0, tsz, tsz); okTiles++; } });
    // sfondo colorato della velocita' modello (come il campo a video: bilineare sulla griglia, qui a celle piccole e poi ingrandito con smussatura)
    buildGridLookup();
    var cell = 8 * PDF_SCALE, cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    var fc = document.createElement('canvas'); fc.width = cols; fc.height = rows;
    var fx = fc.getContext('2d');
    for (var r = 0; r < rows; r++) for (var q = 0; q < cols; q++) {
      var spd = bilinearGridSpeed(pdfLat(y0 + (r + 0.5) * cell), pdfLon(x0 + (q + 0.5) * cell), offset);
      if (spd == null) continue;
      fx.fillStyle = speedToFieldColor(spd); fx.fillRect(q, r, 1, 1);
    }
    c.save(); c.globalAlpha = 0.4; c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.drawImage(fc, 0, 0, cols * cell, rows * cell); c.restore();
    // frecce e numeri: stessa drawAll della pagina
    c.save(); c.scale(PDF_SCALE, PDF_SCALE);
    var T = { ctx: c, w: W / PDF_SCALE, h: H / PDF_SCALE, zoom: PDF_ARROW_ZOOM, offset: offset, labels: [],
      pt: function(lat, lon){ return { x: (pdfWx(lon) - x0) / PDF_SCALE, y: (pdfWy(lat) - y0) / PDF_SCALE }; } };
    await drawAll(T);
    // nomi delle zone (non c'e' popup sulla carta): sotto la freccia, con bordo scuro per leggerli su qualsiasi colore
    c.font = '700 10px -apple-system, Helvetica, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top'; c.lineJoin = 'round';
    // posto del nome: sotto la freccia; se li' c'e' gia' un altro nome (zone vicine, es. Elba Nord / Elba Sud) si prova sopra, poi a destra e a sinistra, poi si salta
    var placed = [];
    T.labels.forEach(function(l){
      l.short = l.name.split(' - ')[0]; // sulla carta basta la parte prima del trattino ("Forte dei Marmi - Versilia N" -> "Forte dei Marmi"): i nomi interi coprivano la mappa
      var tw = c.measureText(l.short).width + 4, th = 12;
      var cand = [[0, 15], [0, -29], [tw / 2 + 12, -7], [-tw / 2 - 12, -7], [0, 29], [0, -43]];
      for (var ci = 0; ci < cand.length; ci++) {
        var cx = l.x + cand[ci][0], cy = l.y + cand[ci][1], bx0 = cx - tw / 2, bx1 = cx + tw / 2, by0 = cy, by1 = cy + th, hit = false;
        for (var pi = 0; pi < placed.length; pi++) { var o = placed[pi]; if (bx0 < o[2] && bx1 > o[0] && by0 < o[3] && by1 > o[1]) { hit = true; break; } }
        if (hit) continue;
        placed.push([bx0, by0, bx1, by1]);
        c.lineWidth = 3; c.strokeStyle = 'rgba(2,12,24,0.85)'; c.strokeText(l.short, cx, cy + 1);
        c.fillStyle = l.model ? '#9ec5e6' : '#ffffff'; c.fillText(l.short, cx, cy + 1);
        break;
      }
    });
    c.restore();
    var jpg = cv.toDataURL('image/jpeg', 0.9); // se la cartina avesse "contaminato" il canvas, qui scatta un errore e lo vediamo
    var bin = atob(jpg.split(',')[1]), u8 = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);

    // pagina
    var pdf = new NautilusPdf(), p = pdf.addPage(page.w, page.h), idx = pdf.addImage(u8, W, H);
    var now = new Date();
    function dayTxt(d){ return new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', weekday: 'short', day: '2-digit', month: '2-digit' }).format(d); }
    function hmTxt(d){ return new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hour12: false }).format(d); }
    p.text(mxp, 24, 'NAUTILUS - Previsioni vento (nodi)', { size: 13, font: 'B' });
    p.text(page.w - mxp, 24, 'SCARICATO ' + dayTxt(now) + ' alle ' + hmTxt(now), { size: 13, font: 'B', align: 'r', color: '#b00000' });
    var big = offset === 0 ? 'ADESSO - dati reali delle ' + hmTxt(now) : 'ORE ' + romeHourLabel(hb.date) + ' - ' + dayTxt(hb.date) + '  (+' + offset + ' h)';
    p.text(mxp, 54, big, { size: 22, font: 'B' });
    p.text(page.w - mxp, 40, offset === 0 ? 'Vale per pochi minuti: poi scarica un nuovo PDF.' : 'Previsione per quell\'ora. Dopo, non fidarti: scarica un nuovo PDF.', { size: 8, align: 'r', color: '#b00000' });
    p.text(mxp, 72, 'Dati caricati alle ' + (state.lastFetch ? hmTxt(state.lastFetch) : '?') + (okTiles ? '' : '  -  cartina di fondo non disponibile'), { size: 8, color: '#333333' });
    p.image(mxp, topH, imgWpt, imgHpt, idx);
    p.rect(mxp, topH, imgWpt, imgHpt, { stroke: '#444444', lw: 0.8 });
    // legenda
    var ly = topH + imgHpt + 12, lx = mxp, sc = [[0.5, '0-3'], [4, '4-6'], [7, '7-10'], [11, '11-16'], [17, '17-21'], [22, '22-27'], [28, '28-33'], [34, '34+']];
    function onCol(hex){ var v = parseInt(hex.slice(1), 16); return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) < 140 ? '#ffffff' : '#111111'; }
    p.text(lx, ly + 8, 'Nodi:', { size: 8, font: 'B' }); lx += 30;
    sc.forEach(function(e){ var col = windColor(e[0]); p.rect(lx, ly, 34, 11, { fill: col }); p.text(lx + 17, ly + 8.5, e[1], { size: 7, align: 'c', color: onCol(col) }); lx += 35; });
    p.text(mxp, ly + 26, 'La freccia punta dove va il vento. Zone nostre: freccia doppia (vento e raffica) con il nome; frecce piccole: modello Open-Meteo.', { size: 7.5, color: '#333333' });
    p.text(mxp, ly + 38, 'Numeri: bianco = dato nostro (lettura vera, stima o nostra previsione); azzurro = solo modello. Colore di fondo: velocita\' del modello.', { size: 7.5, color: '#333333' });
    p.text(mxp, ly + 50, 'Zone senza nostra previsione per quest\'ora mostrano il modello Open-Meteo del punto piu\' vicino.', { size: 7.5, color: '#333333' });
    var bytes = pdf.build({ title: 'NAUTILUS previsioni ' + romeHourLabel(hb.date) });
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var fname = 'nautilus_mappa_' + (offset === 0 ? 'adesso' : 'ore' + romeHourLabel(hb.date)) + '_' + now.toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.pdf';
    var url = URL.createObjectURL(blob);
    if (pdfWin && !pdfWin.closed) { pdfWin.location.href = url; }
    else { var a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } // scheda bloccata dal browser: scarica come prima
    setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
  } catch (e) {
    if (pdfWin && !pdfWin.closed) pdfWin.close();
    alert('Errore PDF: ' + e.message);
  } finally {
    btn.innerHTML = oldText;
  }
}
