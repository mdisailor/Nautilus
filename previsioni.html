<style>

<body>

<header>

<div id="hourbar"><!-- popolato via JS, cambia ogni refresh --></div>

<div id="mapwrap">

    <div><b>═══▶▶</b> doppia freccia = nostra previsione, dall'ultimo predict</div>

    <div style="margin-top:6px;">Colore = intensità (scala Beaufort)</div>
  </div>
  <div id="status"></div>
</div>

<script>
var ENGINE_URL = 'https://nautilus-red.vercel.app/api/engine';
var REFRESH_MS = 600000; // 10 minuti, stessa cadenza di mappa.html

// ==================== Griglia (identica a mappa.html: 0.25 gradi) ====================
var GRID = [];
for (var _la = 40.0; _la <= 44.6; _la = Math.round((_la+0.25)*100)/100) {
  for (var _lo = 7.4; _lo <= 12.5; _lo = Math.round((_lo+0.25)*100)/100) {
    GRID.push({ lat:_la, lon:_lo });
  }
}

// ==================== Tabella rosa dei venti -> gradi (16 punti, IT) ====================
var COMPASS_TO_DEG = {
  'N':0, 'NNE':22.5, 'NE':45, 'ENE':67.5, 'E':90, 'ESE':112.5, 'SE':135, 'SSE':157.5,
  'S':180, 'SSO':202.5, 'SO':225, 'OSO':247.5, 'O':270, 'ONO':292.5, 'NO':315, 'NNO':337.5
};

function parseForecastFromText(text, h) {
  if (!text) return null;
  var re = new RegExp('H\\+?' + h + '\\s*:\\s*([0-9]+\\.?[0-9]*)\\s*kn\\s*da\\s*([A-Za-z]+)', 'i');
  var m = text.match(re);
  if (!m) return null;
  var dirTxt = m[2].toUpperCase();
  var deg = COMPASS_TO_DEG[dirTxt];
  if (deg === undefined) return null;
  return { speed: parseFloat(m[1]), dir: deg };
}

// ==================== Tempo: "ora corrente" come istante assoluto (floor all'ora) ====================
// Nota: si assume che il fuso del browser abbia lo stesso offset a ore intere di
// Europe/Rome (vero per l'uso reale dell'app, Toscana). L'etichetta a video usa
// comunque Intl con timeZone esplicito, per correttezza visiva indipendente dal device.
function floorToHour(d){
  return new Date(d.getTime() - (d.getMinutes()*60000 + d.getSeconds()*1000 + d.getMilliseconds()));
}
function romeHourLabel(d){
  return new Intl.DateTimeFormat('it-IT', { timeZone:'Europe/Rome', hour:'2-digit', hour12:false }).format(d);
}
function romeDayLabel(d){
  return new Intl.DateTimeFormat('it-IT', { timeZone:'Europe/Rome', day:'2-digit', month:'2-digit' }).format(d);
}

// ==================== Stile frecce (identico a mappa.html v1.6.88) ====================
function windColor(s){
  if (s >= 34) return '#cc0000';
  if (s >= 28) return '#ff3300';
  if (s >= 22) return '#ff8800';
  if (s >= 17) return '#ffdd00';
  if (s >= 11) return '#00cc44';
  if (s >= 7)  return '#00ee88';
  if (s >= 4)  return '#44ddcc';
  if (s >= 1)  return '#88ccff';
  return '#aaddff';
}

function drawSingleArrow(ctx, ox, oy, rad, len, lw, colShaft, colHead, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(ox, oy);
  ctx.rotate(rad);
  var hw = len * 0.40;
  var lwOut = lw + 2.5;
  ctx.beginPath();
  ctx.moveTo(0, len * 0.45);
  ctx.lineTo(0, -len * 0.25);
  ctx.strokeStyle = 'rgba(90,90,90,0.5)';
  ctx.lineWidth = lwOut;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.50);
  ctx.lineTo(-hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.lineTo( hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(90,90,90,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(90,90,90,0.5)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, len * 0.45);
  ctx.lineTo(0, -len * 0.25);
  ctx.strokeStyle = colShaft;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.50);
  ctx.lineTo(-hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.lineTo( hw * 0.52, -len * 0.50 + hw * 0.88);
  ctx.closePath();
  ctx.fillStyle = colHead;
  ctx.fill();
  ctx.restore();
}

function drawArrow(ctx, cx, cy, dir, spd, gust, alpha, isZone, zoom){
  if (spd === null || spd === undefined || isNaN(spd)) return;
  if (dir === null || dir === undefined || isNaN(dir)) return;
  var zScale = Math.max(0.4, Math.min(1.4, (zoom - 6) * 0.3));
  var base = isZone ? 28 * zScale : 16 * zScale;
  var extra = Math.min(spd * 1.6, 18) * zScale;
  var len = base + extra;
  var lw = isZone ? Math.max(2, 4 * zScale) : Math.max(1.5, 2.8 * zScale);
  var rad = (dir - 180) * Math.PI / 180;
  var colSpd  = windColor(spd);
  var colGust = (gust != null && !isNaN(gust)) ? windColor(gust) : colSpd;

  if (isZone) {
    var off = 5 * zScale;
    var perpX = Math.cos(rad) * off;
    var perpY = Math.sin(rad) * off;
    drawSingleArrow(ctx, cx - perpX, cy - perpY, rad, len, lw, colSpd, colSpd, alpha);
    drawSingleArrow(ctx, cx + perpX, cy + perpY, rad, len, lw, colGust, colGust, alpha);
  } else {
    drawSingleArrow(ctx, cx, cy, rad, len, lw, colSpd, colGust, alpha);
  }
}

// ==================== Stato ====================
var state = {
  gridPoints: [],       // da action=grid (con .forecast.h1..h12)
  zonePoints: [],       // { lat, lon, name, key, biasStation, genDate, h1..h12:{speed,dir} }
  stationsNow: {},       // da action=stations_snapshot: { stationId: {wind_kt,direction,gust_kt,age_min} }
  hourButtons: [],       // [{ offset, date }] ricostruito ad ogni loadAll
  currentOffset: 0,      // quale bottone e' selezionato -- persiste tra i refresh
  lastFetch: null
};

// ==================== Flusso animato ====================
var particleState = { active:false, field:null, fieldRes:14, fieldW:0, fieldH:0, particles:[], animFrame:null };
var pCanvas, pCtx;
var PARTICLE_COUNT = 600;
var MAX_AGE = 60;

function buildVectorField(){
  var W = pCanvas.width, H = pCanvas.height;
  var res = particleState.fieldRes;
  var cols = Math.ceil(W / res);
  var rows = Math.ceil(H / res);
  particleState.fieldW = cols;
  particleState.fieldH = rows;
  var EPS = 1e-10;

  var omSources = [];
  state.gridPoints.forEach(function(g){
    var px = map.latLngToContainerPoint([g.lat, g.lon]);
    if (px.x < -300 || px.x > W+300 || px.y < -300 || px.y > H+300) return;
    var gv = omValueForOffset(g, state.currentOffset);
    if (!gv || gv.dir == null || gv.speed == null || isNaN(gv.dir) || isNaN(gv.speed)) return;
    var rad = gv.dir * Math.PI / 180;
    omSources.push({ x:px.x, y:px.y, u:-Math.sin(rad)*gv.speed, v:Math.cos(rad)*gv.speed });
  });

  var nauSources = [];
  state.zonePoints.forEach(function(z){
    var v = ourValueForOffset(z, state.currentOffset);
    if (!v || v.dir == null || v.speed == null || isNaN(v.dir) || isNaN(v.speed)) return;
    var px = map.latLngToContainerPoint([z.lat, z.lon]);
    var rad = v.dir * Math.PI / 180;
    nauSources.push({ x:px.x, y:px.y, u:-Math.sin(rad)*v.speed, v:Math.cos(rad)*v.speed, w:10.0 });
  });

  if (omSources.length === 0 && nauSources.length === 0){ particleState.field = null; return; }

  var field = new Float32Array(cols * rows * 2);
  for (var row = 0; row < rows; row++){
    for (var col = 0; col < cols; col++){
      var cx = col * res + res/2, cy = row * res + res/2;
      var sumU = 0, sumV = 0, sumW = 0;
      for (var ni = 0; ni < nauSources.length; ni++){
        var n = nauSources[ni];
        var dxn = cx-n.x, dyn = cy-n.y, d2n = dxn*dxn+dyn*dyn;
        if (d2n < 900) d2n = 900;
        var wn = n.w/d2n; sumU += n.u*wn; sumV += n.v*wn; sumW += wn;
      }
      for (var oi = 0; oi < omSources.length; oi++){
        var o = omSources[oi];
        var dxo = cx-o.x, dyo = cy-o.y, d2o = dxo*dxo+dyo*dyo;
        if (d2o < 900) d2o = 900;
        var wo = 1.0/d2o; sumU += o.u*wo; sumV += o.v*wo; sumW += wo;
      }
      var idx = (row * cols + col) * 2;
      if (sumW > EPS){ field[idx] = sumU/sumW; field[idx+1] = sumV/sumW; }
    }
  }
  particleState.field = field;
}

function sampleField(px, py){
  var res = particleState.fieldRes;
  var cols = particleState.fieldW, rows = particleState.fieldH;
  if (!particleState.field) return {u:0, v:0, spd:0};
  var col = px / res, row = py / res;
  var c0 = Math.floor(col), c1 = c0+1, r0 = Math.floor(row), r1 = r0+1;
  if (c0 < 0 || r0 < 0 || c1 >= cols || r1 >= rows) return {u:0, v:0, spd:0};
  var tc = col - c0, tr = row - r0;
  function get(r,c){ var i=(r*cols+c)*2; return {u:particleState.field[i], v:particleState.field[i+1]}; }
  var f00=get(r0,c0), f10=get(r1,c0), f01=get(r0,c1), f11=get(r1,c1);
  var u = f00.u*(1-tc)*(1-tr) + f01.u*tc*(1-tr) + f10.u*(1-tc)*tr + f11.u*tc*tr;
  var v = f00.v*(1-tc)*(1-tr) + f01.v*tc*(1-tr) + f10.v*(1-tc)*tr + f11.v*tc*tr;
  return { u:u, v:v, spd:Math.sqrt(u*u+v*v) };
}

function spawnParticle(){
  return { x: Math.random()*pCanvas.width, y: Math.random()*pCanvas.height, age: Math.floor(Math.random()*MAX_AGE) };
}

function particleColor(spd){
  if (spd >= 34) return 'rgba(204,0,0,0.9)';
  if (spd >= 28) return 'rgba(255,51,0,0.9)';
  if (spd >= 22) return 'rgba(255,136,0,0.9)';
  if (spd >= 17) return 'rgba(220,200,0,0.85)';
  if (spd >= 11) return 'rgba(0,180,60,0.85)';
  if (spd >=  7) return 'rgba(0,160,100,0.8)';
  if (spd >=  4) return 'rgba(30,100,200,0.75)';
  if (spd >=  1) return 'rgba(60,60,180,0.7)';
  return 'rgba(80,80,160,0.5)';
}

function animateParticles(){
  if (!particleState.active) return;
  var W = pCanvas.width, H = pCanvas.height;
  pCtx.globalCompositeOperation = 'destination-out';
  pCtx.globalAlpha = 0.04;
  pCtx.fillRect(0, 0, W, H);
  pCtx.globalCompositeOperation = 'source-over';
  pCtx.globalAlpha = 1.0;
  var speedScale = 0.10;
  particleState.particles.forEach(function(p, i){
    var fv = sampleField(p.x, p.y);
    if (fv.spd < 0.3 || p.age > MAX_AGE){ particleState.particles[i] = spawnParticle(); return; }
    var nx = p.x + fv.u * speedScale, ny = p.y + fv.v * speedScale;
    if (nx < 0 || nx > W || ny < 0 || ny > H){ particleState.particles[i] = spawnParticle(); return; }
    pCtx.beginPath();
    pCtx.moveTo(p.x, p.y);
    pCtx.lineTo(nx, ny);
    pCtx.strokeStyle = particleColor(fv.spd);
    pCtx.lineWidth = fv.spd > 22 ? 2.0 : fv.spd > 11 ? 1.6 : 1.2;
    pCtx.stroke();
    p.x = nx; p.y = ny; p.age++;
  });
  particleState.animFrame = requestAnimationFrame(animateParticles);
}

function startParticles(){
  if (!particleState.field) return;
  if (particleState.animFrame) cancelAnimationFrame(particleState.animFrame);
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particleState.particles = [];
  for (var i = 0; i < PARTICLE_COUNT; i++) particleState.particles.push(spawnParticle());
  animateParticles();
}

function stopParticles(){
  if (particleState.animFrame){ cancelAnimationFrame(particleState.animFrame); particleState.animFrame = null; }
  if (pCtx) pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
}

function resizeParticleCanvas(){
  if (!pCanvas) return;
  var size = map.getSize();
  pCanvas.width = size.x; pCanvas.height = size.y;
}

function rebuildAndAnimate(){
  if (!particleState.active) return;
  buildVectorField();
  startParticles();
}

// ==================== Mappa ====================
var map, canvas, ctx;

function initMap(){
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([43.2, 10.0], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 12
  }).addTo(map);
  canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.top = '0'; canvas.style.left = '0';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = 500;
  map.getPanes().overlayPane.appendChild(canvas);
  ctx = canvas.getContext('2d');
  pCanvas = document.getElementById('particle-canvas');
  pCtx = pCanvas.getContext('2d');
  function resizeCanvas(){
    var size = map.getSize();
    canvas.width = size.x; canvas.height = size.y;
    var topLeft = map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(canvas, topLeft);
    resizeParticleCanvas();
  }
  map.on('move resize zoom', function(){ resizeCanvas(); drawAll(); });
  map.on('moveend zoomend', function(){ if (particleState.active) rebuildAndAnimate(); });
  resizeCanvas();
}

async function fetchJson(url){
  var r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ==================== Caricamento dati ====================
async function loadGrid(){
  var lats = GRID.map(function(p){ return p.lat; }).join(',');
  var lons = GRID.map(function(p){ return p.lon; }).join(',');
  var d = await fetchJson(ENGINE_URL + '?action=grid&lats=' + lats + '&lons=' + lons);
  state.gridPoints = d.points || [];
}

async function loadStationsSnapshot(){
  var d = await fetchJson(ENGINE_URL + '?action=stations_snapshot');
  state.stationsNow = d.stations || {};
}

async function loadZones(){
  var zd = await fetchJson(ENGINE_URL + '?action=zones');
  var zones = (zd.zones || []).filter(function(z){ return z.bias_station; });
  var results = await Promise.allSettled(zones.map(function(z){
    return fetchJson(ENGINE_URL + '?action=predict_history&zone=' + encodeURIComponent(z.key) + '&limit=1')
      .then(function(ph){
        var item = (ph.predictions || [])[0];
        var p = item ? (item.prediction || item) : null;
        return { zone: z, p: p };
      });
  }));
  var zonePoints = [];
  results.forEach(function(r){
    if (r.status !== 'fulfilled' || !r.value.p) return;
    var z = r.value.zone, p = r.value.p;
    var text = p.prediction_text || '';
    var entry = {
      lat: z.lat, lon: z.lon, name: z.name, key: z.key,
      biasStation: z.bias_station,
      genDate: p.generated_at ? new Date(p.generated_at) : null
    };
    [1,3,6,9,12].forEach(function(h){
      var speedField = p['forecast_h' + h]; // gia' corretto (bias applicato)
      var parsed = parseForecastFromText(text, h);
      entry['h' + h] = (speedField != null && parsed) ? { speed: speedField, dir: parsed.dir } : null;
    });
    zonePoints.push(entry);
  });
  state.zonePoints = zonePoints;
}

// ==================== Bottoni ora ====================
function buildHourButtons(){
  var nowFloored = floorToHour(new Date());
  var buttons = [];
  for (var i = 0; i <= 12; i++){
    buttons.push({ offset: i, date: new Date(nowFloored.getTime() + i * 3600000) });
  }
  state.hourButtons = buttons;
}

// Vero se questa zona ha una previsione nostra valida per questo bottone (scarto
// dall'ULTIMO PREDICT, non da adesso -- l'"orologio nostro").
function ourValueForOffset(zoneEntry, offset){
  if (!zoneEntry.genDate || offset === 0) return null; // bottone "ora" non mostra mai l'AI
  var btn = state.hourButtons[offset];
  if (!btn) return null;
  var genFloored = floorToHour(zoneEntry.genDate);
  var offsetFromPredict = Math.round((btn.date.getTime() - genFloored.getTime()) / 3600000);
  if ([1,3,6,9,12].indexOf(offsetFromPredict) === -1) return null;
  return zoneEntry['h' + offsetFromPredict] || null;
}

// OM per questo bottone -- sempre relativo ad "adesso" (l'"orologio OM"), mai al predict.
function omValueForOffset(gridPoint, offset){
  if (offset === 0) return { speed: gridPoint.speed, dir: gridPoint.dir, gust: gridPoint.gust };
  return (gridPoint.forecast && gridPoint.forecast['h' + offset]) ? gridPoint.forecast['h' + offset] : null;
}

function renderHourBar(){
  var bar = document.getElementById('hourbar');
  bar.innerHTML = '';
  state.hourButtons.forEach(function(btn){
    var b = document.createElement('button');
    b.className = 'hbtn' + (btn.offset === 0 ? ' now' : '') + (btn.offset === state.currentOffset ? ' active' : '');
    // ha almeno una zona con previsione nostra valida per questo bottone?
    var hasOur = btn.offset !== 0 && state.zonePoints.some(function(z){ return !!ourValueForOffset(z, btn.offset); });
    if (hasOur) b.className += ' has-our';
    var todayLabel = romeDayLabel(new Date());
    var btnDayLabel = romeDayLabel(btn.date);
    var dayMark = (btnDayLabel !== todayLabel) ? ('<span class="daymark">' + btnDayLabel + '</span>') : '';
    b.innerHTML = romeHourLabel(btn.date) + dayMark;
    b.addEventListener('click', function(){
      state.currentOffset = btn.offset;
      renderHourBar();
      drawAll();
      if (particleState.active) rebuildAndAnimate();
    });
    bar.appendChild(b);
  });
}

function nearestGridPoint(lat, lon){
  var best = null, bestD = Infinity;
  state.gridPoints.forEach(function(g){
    var d = Math.pow(g.lat-lat,2) + Math.pow(g.lon-lon,2);
    if (d < bestD) { bestD = d; best = g; }
  });
  return best;
}

// ==================== Disegno ====================
function drawAll(){
  if (!ctx) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var bounds = map.getBounds();
  var zoom = map.getZoom();
  var minPx = zoom >= 10 ? 18 : zoom >= 9 ? 22 : 30;
  var drawn = [];
  var offset = state.currentOffset;

  function tryDraw(lat, lon, dir, spd, gust, isZone){
    if (!bounds.contains([lat, lon])) return;
    var pt = map.latLngToContainerPoint([lat, lon]);
    for (var i = 0; i < drawn.length; i++){
      var dx = pt.x - drawn[i].x, dy = pt.y - drawn[i].y;
      if (Math.sqrt(dx*dx+dy*dy) < minPx) return;
    }
    drawn.push(pt);
    drawArrow(ctx, pt.x, pt.y, dir, spd, gust, 0.95, isZone, zoom);
  }

  // Zone nostre per prime (vincono lo spazio)
  state.zonePoints.forEach(function(z){
    if (offset === 0) {
      // bottone "ora": dato reale stazione, mai AI
      var st = state.stationsNow[z.biasStation];
      if (st && st.wind_kt != null && st.direction != null) {
        tryDraw(z.lat, z.lon, st.direction, st.wind_kt, st.gust_kt, true);
        return;
      }
      // nessuna lettura reale recente -- cade sull'OM del punto griglia piu' vicino
      var g0 = nearestGridPoint(z.lat, z.lon);
      if (g0) tryDraw(z.lat, z.lon, g0.dir, g0.speed, g0.gust, false);
      return;
    }
    var v = ourValueForOffset(z, offset);
    if (v) {
      tryDraw(z.lat, z.lon, v.dir, v.speed, null, true);
    } else {
      var g = nearestGridPoint(z.lat, z.lon);
      if (g) {
        var gv = omValueForOffset(g, offset);
        if (gv) tryDraw(z.lat, z.lon, gv.dir, gv.speed, gv.gust, false);
      }
    }
  });

  // Griglia OM di sfondo -- sempre dall'orologio OM (relativo ad adesso)
  state.gridPoints.forEach(function(g){
    var gv = omValueForOffset(g, offset);
    if (!gv) return;
    tryDraw(g.lat, g.lon, gv.dir, gv.speed, gv.gust, false);
  });
}

function updateFreshness(){
  var el = document.getElementById('freshness');
  if (!state.lastFetch) { el.textContent = 'In caricamento...'; return; }
  var d = state.lastFetch;
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  el.textContent = 'Dati aggiornati alle ' + hh + ':' + mm + ' (si aggiorna da solo ogni 10 min)';
}

async function loadAll(){
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Aggiorno...';
  try {
    await Promise.all([loadGrid(), loadZones(), loadStationsSnapshot()]);
    buildHourButtons();
    state.lastFetch = new Date();
    updateFreshness();
    statusEl.textContent = state.zonePoints.length + ' zone, ' + state.gridPoints.length + ' punti griglia';
    renderHourBar();
    drawAll();
    if (particleState.active) rebuildAndAnimate();
  } catch(e) {
    statusEl.textContent = 'Errore: ' + e.message;
  }
}

document.getElementById('btn-flow').addEventListener('click', function(){
  particleState.active = !particleState.active;
  this.classList.toggle('active', particleState.active);
  if (particleState.active){
    buildVectorField();
    startParticles();
  } else {
    stopParticles();
  }
});

initMap();
loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
